name: Validate tasks

on:
  pull_request:
  push:
    branches: [main]
    paths: ["week-*/**", "tools/**", "templates/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed tasks; a PR may only touch its author's folder
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        # On pull requests, run the base branch's copy of the planner so a PR can't edit its own guard.
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git show "$BASE:tools/ci_plan.py" > /tmp/ci_plan.py
          else
            cp tools/ci_plan.py /tmp/ci_plan.py
          fi
          python3 /tmp/ci_plan.py

  validate:
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Static checks, oracle scores 1, nop scores 0
        env:
          TASK: ${{ matrix.task }}
        run: tools/validate.sh "$TASK"
